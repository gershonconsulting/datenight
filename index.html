<!DOCTYPE html>
<html>
<head>
  <title>6 à Table</title>
  <style>
    body { font-family: Arial; background: #f0f0f0; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; }
    .subtitle { color: #666; font-size: 14px; margin-top: 5px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
    .tab { padding: 10px 20px; background: none; border: none; cursor: pointer; font-size: 14px; color: #666; }
    .tab.active { color: #2196F3; border-bottom: 3px solid #2196F3; margin-bottom: -1px; }
    .content { display: none; }
    .content.active { display: block; }
    .calendar { background: white; padding: 20px; border-radius: 8px; }
    .month { margin-bottom: 30px; }
    .month-title { font-weight: bold; margin-bottom: 10px; }
    .dates { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .date-btn { padding: 10px; border: 1px solid #ddd; background: white; cursor: pointer; text-align: center; border-radius: 4px; font-size: 12px; }
    .date-btn.green { background: #c8e6c9; }
    .date-btn.orange { background: #ffe0b2; }
    .date-btn.red { background: #ffcdd2; }
    .date-btn.disabled { background: #f5f5f5; color: #999; cursor: default; }
    .results { background: white; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>6 à Table</h1>
      <p class="subtitle">Attali, Raccah, and Attia • v1.1</p>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="showTab(event, 'attia')">Attia</button>
      <button class="tab" onclick="showTab(event, 'raccah')">Raccah</button>
      <button class="tab" onclick="showTab(event, 'attali')">Attali</button>
      <button class="tab" onclick="showTab(event, 'results')">Results</button>
    </div>

    <div id="attia" class="content active"><div class="calendar" id="attia-cal"></div></div>
    <div id="raccah" class="content"><div class="calendar" id="raccah-cal"></div></div>
    <div id="attali" class="content"><div class="calendar" id="attali-cal"></div></div>
    <div id="results" class="content"><div class="results" id="results-cal"></div></div>
  </div>

  <script>
    const couples = ['attia', 'raccah', 'attali'];
    let data = {};

    const prefilledData = {
      "attia-7-1": "green", "attia-7-2": "orange", "attia-7-3": "red", "attia-7-4": "red", "attia-7-5": "red", "attia-7-6": "red", "attia-7-7": "red", "attia-7-8": "red", "attia-7-9": "orange", "attia-7-10": "orange", "attia-7-11": "orange", "attia-7-12": "orange", "attia-7-13": "orange", "attia-7-14": "orange", "attia-7-15": "orange", "attia-7-16": "orange", "attia-7-17": "orange", "attia-7-18": "orange", "attia-7-19": "orange", "attia-7-20": "orange", "attia-7-21": "orange", "attia-7-22": "green", "attia-7-23": "orange", "attia-7-24": "orange", "attia-7-25": "orange", "attia-7-26": "orange", "attia-7-27": "orange", "attia-7-28": "orange", "attia-7-29": "green", "attia-7-30": "red", "attia-7-31": "green",
      "attia-8-1": "green", "attia-8-2": "green", "attia-8-3": "green", "attia-8-4": "red", "attia-8-5": "green", "attia-8-6": "green", "attia-8-7": "orange", "attia-8-8": "green", "attia-8-9": "green", "attia-8-10": "red", "attia-8-11": "red", "attia-8-12": "red", "attia-8-13": "red", "attia-8-14": "green", "attia-8-15": "green", "attia-8-16": "green", "attia-8-17": "green", "attia-8-18": "orange", "attia-8-19": "orange", "attia-8-20": "red", "attia-8-21": "orange", "attia-8-22": "green", "attia-8-23": "green", "attia-8-24": "orange", "attia-8-25": "orange", "attia-8-26": "orange", "attia-8-27": "orange", "attia-8-28": "green", "attia-8-29": "green", "attia-8-30": "green",
      "raccah-7-1": "red", "raccah-7-2": "red", "raccah-7-3": "green", "raccah-7-4": "green", "raccah-7-5": "green", "raccah-7-6": "green", "raccah-7-7": "orange", "raccah-7-8": "red", "raccah-7-9": "red", "raccah-7-10": "green", "raccah-7-11": "green", "raccah-7-12": "red", "raccah-7-13": "red", "raccah-7-14": "red", "raccah-7-15": "red", "raccah-7-16": "red", "raccah-7-17": "green", "raccah-7-18": "green", "raccah-7-19": "red", "raccah-7-20": "red", "raccah-7-21": "orange", "raccah-7-22": "orange", "raccah-7-23": "orange", "raccah-7-24": "orange", "raccah-7-25": "red", "raccah-7-26": "red", "raccah-7-27": "red", "raccah-7-28": "orange", "raccah-7-29": "orange", "raccah-7-30": "red", "raccah-7-31": "green",
      "raccah-8-1": "red", "raccah-8-2": "red", "raccah-8-3": "red", "raccah-8-4": "red", "raccah-8-5": "red", "raccah-8-6": "red", "raccah-8-7": "orange", "raccah-8-8": "green", "raccah-8-9": "green", "raccah-8-10": "red", "raccah-8-11": "red", "raccah-8-12": "red", "raccah-8-13": "red", "raccah-8-14": "orange", "raccah-8-15": "green", "raccah-8-16": "green", "raccah-8-17": "green", "raccah-8-18": "green", "raccah-8-19": "green", "raccah-8-20": "green", "raccah-8-21": "green", "raccah-8-22": "green", "raccah-8-23": "green", "raccah-8-24": "green", "raccah-8-25": "red", "raccah-8-26": "red", "raccah-8-27": "red", "raccah-8-28": "orange", "raccah-8-29": "green", "raccah-8-30": "green"
    };
    
    Object.assign(data, prefilledData);
    localStorage.setItem('data', JSON.stringify(data));

    function showTab(e, name) {
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      e.target.classList.add('active');
      if (name === 'results') renderResults();
    }

    function renderCalendar(couple) {
      const html = [];
      for (let m = 7; m <= 8; m++) {
        html.push(`<div class="month"><div class="month-title">${new Date(2026, m, 1).toLocaleString('en-US', {month:'long', year:'numeric'})}</div>`);
        html.push('<div class="dates">');
        const firstDay = new Date(2026, m, 1).getDay();
        for (let i = 0; i < firstDay; i++) html.push('<div></div>');
        const lastDay = new Date(2026, m + 1, 0).getDate();
        for (let d = 1; d <= lastDay; d++) {
          const key = `${couple}-${m}-${d}`;
          const state = data[key] || 'none';
          const colors = {none:'', green: 'green', orange: 'orange', red: 'red'};
          html.push(`<button class="date-btn ${colors[state]}" onclick="toggle('${key}','${couple}')">${d}</button>`);
        }
        html.push('</div></div>');
      }
      document.getElementById(couple + '-cal').innerHTML = html.join('');
    }

    function renderResults() {
      const html = [];
      for (let m = 7; m <= 8; m++) {
        html.push(`<div class="month"><div class="month-title">${new Date(2026, m, 1).toLocaleString('en-US', {month:'long', year:'numeric'})}</div>`);
        html.push('<div class="dates">');
        const firstDay = new Date(2026, m, 1).getDay();
        for (let i = 0; i < firstDay; i++) html.push('<div></div>');
        const lastDay = new Date(2026, m + 1, 0).getDate();
        for (let d = 1; d <= lastDay; d++) {
          const key = `${m}-${d}`;
          const counts = {green: 0, orange: 0};
          couples.forEach(c => {
            const state = data[`${c}-${key}`];
            if (state === 'green') counts.green++;
            else if (state === 'orange') counts.orange++;
          });
          let state = 'disabled';
          if (counts.green > 0) state = 'green';
          else if (counts.orange > 0) state = 'orange';
          html.push(`<button class="date-btn ${state}" disabled>${d}</button>`);
        }
        html.push('</div></div>');
      }
      document.getElementById('results-cal').innerHTML = html.join('');
    }

    function toggle(key, couple) {
      const states = ['none', 'green', 'orange', 'red'];
      const current = data[key] || 'none';
      const next = states[(states.indexOf(current) + 1) % states.length];
      data[key] = next === 'none' ? undefined : next;
      localStorage.setItem('data', JSON.stringify(data));
      renderCalendar(couple);
      renderResults();
    }

    couples.forEach(renderCalendar);
    renderResults();
  </script>
</body>
</html>
