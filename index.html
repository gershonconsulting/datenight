<!DOCTYPE html>
<html>
<head>
  <title>6 à Table</title>
  <style>
    body { font-family: Arial; background: #f0f0f0; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; }
    .subtitle { color: #666; font-size: 14px; margin-top: 5px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #ddd; }
    .tab { padding: 10px 20px; background: none; border: none; cursor: pointer; font-size: 14px; color: #666; }
    .tab.active { color: #2196F3; border-bottom: 3px solid #2196F3; margin-bottom: -1px; }
    .content { display: none; }
    .content.active { display: block; }
    .calendar { background: white; padding: 20px; border-radius: 8px; }
    .month { margin-bottom: 30px; }
    .month-title { font-weight: bold; margin-bottom: 10px; }
    .dates { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .date-btn { padding: 10px; border: 1px solid #ddd; background: white; cursor: pointer; text-align: center; border-radius: 4px; }
    .date-btn.green { background: #c8e6c9; }
    .date-btn.orange { background: #ffe0b2; }
    .date-btn.red { background: #ffcdd2; }
    .results { background: white; padding: 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>6 à Table</h1>
      <p class="subtitle">Attali, Raccah, and Attia • v1.0</p>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="showTab('attia')">Attia</button>
      <button class="tab" onclick="showTab('raccah')">Raccah</button>
      <button class="tab" onclick="showTab('attali')">Attali</button>
      <button class="tab" onclick="showTab('results')">Results</button>
    </div>

    <div id="attia" class="content active">
      <div class="calendar" id="attia-cal"></div>
    </div>
    <div id="raccah" class="content">
      <div class="calendar" id="raccah-cal"></div>
    </div>
    <div id="attali" class="content">
      <div class="calendar" id="attali-cal"></div>
    </div>
    <div id="results" class="content">
      <div class="results" id="results-content"></div>
    </div>
  </div>

  <script>
    const couples = ['attia', 'raccah', 'attali'];
    let data = {};

    function showTab(name) {
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      event.target.classList.add('active');
      if (name === 'results') renderResults();
    }

    function renderCalendar(couple) {
      const html = [];
      for (let m = 7; m <= 8; m++) {
        html.push(`<div class="month"><div class="month-title">${new Date(2026, m, 1).toLocaleString('en-US', {month:'long', year:'numeric'})}</div>`);
        html.push('<div class="dates">');
        const firstDay = new Date(2026, m, 1).getDay();
        for (let i = 0; i < firstDay; i++) html.push('<div></div>');
        const lastDay = new Date(2026, m + 1, 0).getDate();
        for (let d = 1; d <= lastDay; d++) {
          const key = `${couple}-${m}-${d}`;
          const state = data[key] || 'none';
          const colors = {none:'', green: 'green', orange: 'orange', red: 'red'};
          html.push(`<button class="date-btn ${colors[state]}" onclick="toggle('${key}','${couple}')">${d}</button>`);
        }
        html.push('</div></div>');
      }
      document.getElementById(couple + '-cal').innerHTML = html.join('');
    }

    function toggle(key, couple) {
      const states = ['none', 'green', 'orange', 'red'];
      const current = data[key] || 'none';
      const next = states[(states.indexOf(current) + 1) % states.length];
      data[key] = next === 'none' ? undefined : next;
      localStorage.setItem('data', JSON.stringify(data));
      renderCalendar(couple);
      renderResults();
    }

    function renderResults() {
      const html = [];
      const dates = new Set();
      for (let m = 7; m <= 8; m++) {
        for (let d = 1; d <= new Date(2026, m + 1, 0).getDate(); d++) {
          dates.add(`${m}-${d}`);
        }
      }
      const ideal = [], possible = [];
      dates.forEach(date => {
        const counts = {green: 0, orange: 0};
        couples.forEach(c => {
          const state = data[`${c}-${date}`];
          if (state === 'green') counts.green++;
          else if (state === 'orange') counts.orange++;
        });
        if (counts.green > 0) ideal.push(date);
        else if (counts.orange > 0) possible.push(date);
      });
      html.push(`<h3>Ideal dates: ${ideal.length}</h3>`);
      ideal.forEach(d => { const [m,day] = d.split('-'); html.push(`<span style="background:#c8e6c9;padding:5px;margin:5px;display:inline-block;border-radius:4px;">${new Date(2026,m,day).toDateString()}</span>`); });
      html.push(`<h3>Possible dates: ${possible.length}</h3>`);
      possible.forEach(d => { const [m,day] = d.split('-'); html.push(`<span style="background:#ffe0b2;padding:5px;margin:5px;display:inline-block;border-radius:4px;">${new Date(2026,m,day).toDateString()}</span>`); });
      document.getElementById('results-content').innerHTML = html.join('');
    }

    data = JSON.parse(localStorage.getItem('data') || '{}');
    couples.forEach(renderCalendar);
    renderResults();
  </script>
</body>
</html>
